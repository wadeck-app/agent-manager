# Agents (nav /agents): the Claude Code sessions of this machine, read from the Claude Code session registry (~/.claude/sessions/<pid>.json).
# M1b is a deliberately partial slice: registry-fed, pid-only liveness, no daemon or hooks. The note (in the table layout) says so on the page itself.
# The dead sessions (process gone, registry file left) are hidden unless the filter says otherwise; the filter is the URL parameter ?show=all.
# The list is polled every 5 s, once, by this page. A failing source would blank the whole page, so the route answers errors as data (inlineErrors: errorText).
# The layouts of the page are an A/B test (id sessions-layout) wired here, on the real page: `table` is the initial one; the five others are master-detail
# (agents in a left column, the selected one on the right) built by the dsl-lib component agent-manager:AgentWorkspace. They get the rows of $sources.sessions as a
# prop (no request of their own), have their own slim toolbar (title, filter, shortcuts) instead of the header and note of the table, and fill the viewport.
# They write their selection in the URL (?session=). The log style of the right pane is a second A/B test (detail-log-style) declared by the component.
$sources:
  sessions:
    url: GET /api/modules/agent-manager/sessions
    poll: 5s
    params:
      inlineErrors: 'true'
      show: $urlParam.show

$type: PageContent
# `full`: the page frame adds no width cap of its own (the default "xl" stopped the workspace at 1152 px, whatever the screen). The workspace (AgentWorkspace) stretches over the frame padding itself.
maxWidth: full
sections:
  # What went wrong, in boxes of their own: nothing is hidden behind an empty list.
  - $type: Badge
    $if: $sources.sessions.errorText
    label: $sources.sessions.errorText
    variant: danger
  - $type: Badge
    $if: $sources.sessions.unreadableText
    label: $sources.sessions.unreadableText
    variant: warning
  - $type: Badge
    $if: $sources.sessions.emptyText
    label: $sources.sessions.emptyText
    variant: info
  - $type: AbTest
    $if: $sources.sessions.ok
    id: sessions-layout
    label: Sessions layout
    initial: table
    variants:
      table:
        label: Table
        hint: One row per session with every field in a column, the status as a coloured badge, the time of the last status change.
        view:
          $type: VerticalStack
          gap: gap-3
          items:
            - $type: PageHeader
              title: Agents
              subtitle: The Claude Code sessions running on this machine, most recent status change first.
            - $type: Card
              padding: sm
              items:
                - $type: Markdown
                  text: 'M1b: sessions from the Claude Code registry (pid-only liveness). Log and replies (socket transport) are in the master-detail layouts. Daemon, hooks and live updates (SSE): planned'
            - $type: HorizontalStack
              gap: gap-3
              align: items-center
              items:
                - $type: CompactSelect
                  urlParam: show
                  ariaLabel: Sessions to show
                  # As in the queue module: the placeholder is the entry for the unset parameter (the default, alive sessions); the options hold only the other values, so no label appears twice.
                  placeholder: Alive sessions
                  options:
                    - { value: all, label: Alive and dead sessions }
                - $type: Badge
                  $if: $sources.sessions.hiddenText
                  label: $sources.sessions.hiddenText
                  variant: info
                  tone: subtle
            - $type: DataTable
              rows: $sources.sessions.sessions
              rowKey: sessionId
              emptyMessage: No session to show
              # Built by the route: the Harness badge map (green for the most recent version, orange for an older one) depends on the versions found on this machine.
              columns: $sources.sessions.tableColumns
      groups:
        label: "Groups"
        hint: "Herdr-style groups Pinned, Needs you, Done, Working, Idle with counts in a left column, the selected agent on the right. Folder in bold, session name muted, time in state, status icon; decision-46 order inside a group."
        view:
          $type: AbTest
          id: layout-groups-style
          label: "Groups variant"
          initial: comfortable
          variants:
            comfortable:
              label: "Comfortable"
              hint: "Two lines per row: folder, pin mark and time, then the session name and what it waits for or last did. Status icon on the left."
              view:
                $type: agent-manager:AgentWorkspace
                list: groups
                variant: comfortable
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            compact:
              label: "Compact"
              hint: "One line per row like the herdr panel: folder, session name, time, status icon on the right. Densest, no reason text."
              view:
                $type: agent-manager:AgentWorkspace
                list: groups
                variant: compact
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            preview:
              label: "Preview"
              hint: "Compact line plus a second line with the last activity of the agent (tool call or text), when the transcript has one."
              view:
                $type: agent-manager:AgentWorkspace
                list: groups
                variant: preview
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
      inbox:
        label: "Inbox"
        hint: "Triage inbox (Linear / Superhuman / GitHub notifications idea): tabs Needs you, Done, Working, All with counts, and a reason line per row (what the agent waits for)."
        view:
          $type: AbTest
          id: layout-inbox-style
          label: "Inbox variant"
          initial: tabs
          variants:
            tabs:
              label: "Tabs"
              hint: "Underlined tabs with counts; the first non-empty tab opens first. Tab in the URL (?tab=)."
              view:
                $type: agent-manager:AgentWorkspace
                list: inbox
                variant: tabs
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            segmented:
              label: "Segmented and search"
              hint: "A segmented control instead of tabs, plus a search box that filters the open tab."
              view:
                $type: agent-manager:AgentWorkspace
                list: inbox
                variant: segmented
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            autonext:
              label: "Auto-next"
              hint: "Tabs as the first variant; when the session you are on stops needing you (you replied) the next one that needs you opens by itself."
              view:
                $type: agent-manager:AgentWorkspace
                list: inbox
                variant: autonext
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
      tree:
        label: "Tree"
        hint: "Folders (working directories) as parents that show the worst state of their sessions, sessions beneath. A session that started sub-agents opens its sub-agent tree (fetched when you open it)."
        view:
          $type: AbTest
          id: layout-tree-style
          label: "Tree variant"
          initial: expanded
          variants:
            expanded:
              label: "Expanded"
              hint: "Every folder open."
              view:
                $type: agent-manager:AgentWorkspace
                list: tree
                variant: expanded
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            attention:
              label: "Attention only"
              hint: "Folders that do not need you (no Needs you, Done or unknown status) start collapsed."
              view:
                $type: agent-manager:AgentWorkspace
                list: tree
                variant: attention
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            rollup:
              label: "Rollup dots"
              hint: "Every folder starts collapsed and shows a dot and a count per state of its sessions."
              view:
                $type: agent-manager:AgentWorkspace
                list: tree
                variant: rollup
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
      tabs-cards:
        label: "Cards"
        hint: "Rich entries like Warp vertical tabs or an Arc sidebar: title, last-activity subtitle, folder, status pill."
        view:
          $type: AbTest
          id: layout-cards-style
          label: "Cards variant"
          initial: cards
          variants:
            cards:
              label: "Cards"
              hint: "Full-width cards in urgency order."
              view:
                $type: agent-manager:AgentWorkspace
                list: tabs-cards
                variant: cards
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            rail:
              label: "Icon rail"
              hint: "A 56 px rail of monograms with a status icon; it opens as a panel over the detail while the pointer or the keyboard focus is on it. Not resizable."
              view:
                $type: agent-manager:AgentWorkspace
                list: tabs-cards
                variant: rail
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            harness:
              label: "By version"
              hint: "The cards grouped by Claude Code version, newest first."
              view:
                $type: agent-manager:AgentWorkspace
                list: tabs-cards
                variant: harness
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
      palette:
        label: "Search"
        hint: "Search first (herdr goto picker / Raycast idea): a search box with the filters state: and project: (and ! to negate), fuzzy match on name, folder, path and last activity. / focuses it from anywhere."
        view:
          $type: AbTest
          id: layout-palette-style
          label: "Search variant"
          initial: search
          variants:
            search:
              label: "Search and list"
              hint: "Input on top, results below, always shown."
              view:
                $type: agent-manager:AgentWorkspace
                list: palette
                variant: search
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            facets:
              label: "Search and chips"
              hint: "Same, plus one chip per state with its count; a chip writes the state: filter into the search box."
              view:
                $type: agent-manager:AgentWorkspace
                list: palette
                variant: facets
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
            minimal:
              label: "Minimal"
              hint: "Only the input; the results show while it has the focus or text. The detail pane shows the selection."
              view:
                $type: agent-manager:AgentWorkspace
                list: palette
                variant: minimal
                sessions: $sources.sessions.sessions
                userStateError: $sources.sessions.userStateError
                hiddenDead: $sources.sessions.hiddenDead
