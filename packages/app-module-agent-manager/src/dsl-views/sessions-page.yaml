# Agents (nav /agents): the Claude Code sessions of this machine, read from the Claude Code session registry (~/.claude/sessions/<pid>.json).
# Registry-fed (pid-only liveness) plus the sessions owned by the daemon.
# The dead sessions (process gone, registry file left) are hidden unless the filter says otherwise; the filter is the URL parameter ?show=all.
# The list is polled every 5 s, once, by this page. A failing source would blank the whole page, so the route answers errors as data (inlineErrors: errorText).
# The page is the master-detail workspace of the dsl-lib component agent-manager:AgentWorkspace: a toggle between three listing modes (Tree, Groups, Inbox;
# the URL parameter ?mode=, remembered), a search box that works in every mode, the agents in a left column, the selected one on the right. It gets the rows of
# $sources.sessions as a prop (no request of its own), has its own slim toolbar and fills the viewport. It writes its selection in the URL (?session=).
# The table of the sessions is a page of its own: sessions-table.yaml (nav "Table", /table), reached from the side menu.
$sources:
  sessions:
    url: GET /api/modules/agent-manager/sessions
    poll: 5s
    params:
      inlineErrors: 'true'
      show: $urlParam.show

$type: PageContent
# `full`: the page frame adds no width cap of its own (the default "xl" stopped the workspace at 1152 px, whatever the screen). The workspace (AgentWorkspace) stretches over the frame padding itself.
maxWidth: full
sections:
  # The registry could not be listed: the workspace (and its toolbar, which holds the notices button) is not drawn, so a title line with the same notices button says why.
  # Not rendered without a text: an empty component still leaves its wrapper in the page (a gap above the workspace, a dark band in dark mode).
  - $type: agent-manager:PageTitle
    $if: $sources.sessions.errorText
    title: Agents
    errorText: $sources.sessions.errorText
  # The unreadable registry files and the unreadable w-guardrails counters are warnings of the workspace itself (props below): a pill above it pushed the whole page down.
  - $type: Badge
    $if: $sources.sessions.emptyText
    label: $sources.sessions.emptyText
    variant: info
  - $type: agent-manager:AgentWorkspace
    $if: $sources.sessions.ok
    sessions: $sources.sessions.sessions
    userStateError: $sources.sessions.userStateError
    customGroups: $sources.sessions.customGroups
    hiddenDead: $sources.sessions.hiddenDead
    # Why the daemon (owned sessions) could not be asked: the New session dialog shows it with the fix. Never a failure of the page itself.
    ownedError: $sources.sessions.ownedError
    ownedErrorText: $sources.sessions.ownedErrorText
    unreadableText: $sources.sessions.unreadableText
    guardrailsErrorText: $sources.sessions.guardrailsErrorText
    # Owned sessions listed in owned-sessions.json while the daemon is down (their actions are missing), and an unusable owned-sessions.json: persistent warnings.
    ownedDownText: $sources.sessions.ownedDownText
    ownedStateErrorText: $sources.sessions.ownedStateErrorText
