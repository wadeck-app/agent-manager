# Agents (nav /agents): the Claude Code sessions of this machine, read from the Claude Code session registry (~/.claude/sessions/<pid>.json).
# M1b is a deliberately partial slice: registry only, pid-only liveness. The note below says so on the page itself.
# The dead sessions (process gone, registry file left) are hidden unless the filter says otherwise; the filter is the URL parameter ?show=all.
# The list is polled every 5 s. A failing source would blank the whole page, so the route answers errors as data (inlineErrors: errorText).
# The layouts of the list (table, cards, herdr) are an A/B test (id sessions-layout) wired here, on the real page: `table` is the initial one.
# The herdr layout writes through two actions (pin, seen); the route answers a 4xx with a message and a hint, shown as a toast.
$sources:
  sessions:
    url: GET /api/modules/agent-manager/sessions
    poll: 5s
    params:
      inlineErrors: 'true'
      show: $urlParam.show

$actions:
  pinSession:
    url: POST /api/modules/agent-manager/sessions/{sessionId}/pin
    reloadSources: true
    errorPrefix: Could not change the pin
  markSeen:
    url: POST /api/modules/agent-manager/sessions/{sessionId}/seen
    reloadSources: true
    errorPrefix: Could not mark the session seen

$type: PageContent
sections:
  - $type: PageHeader
    title: Agents
    subtitle: The Claude Code sessions running on this machine, most recent status change first.
  - $type: Card
    padding: sm
    items:
      - $type: Markdown
        text: 'M1b: sessions from the Claude Code registry only (pid-only liveness). Hooks, transcripts, replies: planned'
  # What went wrong, in boxes of their own: nothing is hidden behind an empty list.
  - $type: Badge
    $if: $sources.sessions.errorText
    label: $sources.sessions.errorText
    variant: danger
  - $type: Badge
    $if: $sources.sessions.unreadableText
    label: $sources.sessions.unreadableText
    variant: warning
  - $type: HorizontalStack
    $if: $sources.sessions.ok
    gap: gap-3
    align: items-center
    items:
      - $type: CompactSelect
        urlParam: show
        ariaLabel: Sessions to show
        # As in the queue module: the placeholder is the entry for the unset parameter (the default, alive sessions); the options hold only the other values, so no label appears twice.
        placeholder: Alive sessions
        options:
          - { value: all, label: Alive and dead sessions }
      - $type: Badge
        $if: $sources.sessions.hiddenText
        label: $sources.sessions.hiddenText
        variant: info
        tone: subtle
  - $type: Badge
    $if: $sources.sessions.emptyText
    label: $sources.sessions.emptyText
    variant: info
  - $type: AbTest
    $if: $sources.sessions.ok
    id: sessions-layout
    label: Sessions layout
    initial: table
    variants:
      table:
        label: Table
        hint: One row per session with every field in a column, the status as a coloured badge, the time of the last status change.
        view:
          $type: DataTable
          rows: $sources.sessions.sessions
          rowKey: sessionId
          emptyMessage: No session to show
          # Built by the route: the Harness badge map (green for the most recent version, orange for an older one) depends on the versions found on this machine.
          columns: $sources.sessions.tableColumns
      cards:
        label: Cards
        hint: One card per session, the time of the last status change as "5 minutes ago". The cards are built by the route (the DSL has no repeater outside the table).
        view:
          $type: VerticalStack
          gap: gap-3
          items:
            - $type: ExtensionSlot
              items: $sources.sessions.cards
      herdr:
        label: Herdr
        hint: "Sidebar panel like herdr: groups Pinned, Needs you, Done, Working, Idle with counts; folder in bold, session name muted, time in state and a status icon per row; pin and mark-seen buttons. Done = finished since you last looked (first seen sessions start as seen). Built by the route."
        view:
          $type: VerticalStack
          gap: gap-1
          items:
            - $type: Badge
              $if: $sources.sessions.herdrError
              label: $sources.sessions.herdrError
              variant: danger
            - $type: ExtensionSlot
              items: $sources.sessions.herdr
